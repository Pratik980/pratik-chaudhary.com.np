<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      var path = location.pathname + location.search + location.hash;
      sessionStorage.setItem('redirect', path);
      if (path.startsWith('/admin')) {
        location.replace('/admin/');
      } else {
        location.replace('/');
      }
    })();
  </script>
</head>
<body></body>
</html>
